name: CI

on:
  pull_request:
    branches:
      - feature/nextjs-migration
      - main
      - staging
      - prod
  push:
    branches:
      - feature/nextjs-migration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
          GOOGLE_GENERATIVE_AI_API_KEY: ci-placeholder-key
          GEMINI_API_KEY: ci-placeholder-key
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder-client
          GOOGLE_CLIENT_SECRET: ci-placeholder-secret

      - name: Dependency audit
        run: pnpm audit --prod
